<!doctype html>
<html><head><meta charset="utf-8"><title>TradeGen - Lightweight Charts engine</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
  html,body{margin:0;height:100%;background:#0f161d;color:#d6dee5;font:13px system-ui,Segoe UI,sans-serif}
  #bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #26333f}
  #bar button,#bar select{background:#16212b;color:#d6dee5;border:1px solid #2b3946;padding:4px 8px;cursor:pointer;font:inherit}
  #bar button.on{border-color:#5fb3e0;color:#5fb3e0}
  #bar .sep{width:1px;height:20px;background:#2b3946;margin:0 4px}
  #bar label{display:flex;gap:4px;align-items:center}
  #chart{position:absolute;left:0;right:0;bottom:0}
  #title{font-weight:600;margin-right:8px}
  #pineLegend{position:absolute;top:8px;left:10px;z-index:15;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
  #watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;letter-spacing:.04em;color:#d6dee5;opacity:.05;pointer-events:none;z-index:1;user-select:none}
  .pine-pill{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:rgba(15,22,29,.82);color:#d6dee5;border:1px solid #2b3946;border-radius:4px;padding:2px 7px;font-size:12px}
  .pine-pill button{background:none;border:0;color:#93a2af;cursor:pointer;padding:0 2px;font-size:12px;line-height:1}
  .pine-pill button:hover{color:#5fb3e0}
</style></head><body>
<div id="bar">
  <span id="title">Lightweight Charts 5.2.1</span>
  <select id="sym"></select>
  <span id="tfs"></span><span class="sep"></span>
  <select id="style"><option value="candles">Candles</option><option value="hollow">Hollow Candles</option><option value="heikinashi">Heikin-Ashi</option><option value="bars">Bars</option><option value="line">Line</option><option value="area">Area</option><option value="baseline">Baseline</option></select>
  <button id="scaleAuto" class="on" title="Auto-fit price scale">A</button><button id="scaleLog" title="Logarithmic price scale">L</button><button id="scalePct" title="Percentage price scale">%</button>
  <span class="sep"></span>
  <button data-quick="">Cursor</button><button data-quick="trend-line">Trend</button><button data-quick="horizontal-line">H-line</button><button data-quick="rectangle">Rect</button><button data-quick="fib-retracement">Fib</button>
  <select id="alltools"><option value="">All 86 tools...</option></select>
  <span class="sep"></span>
  <label><input type="checkbox" id="ema" checked>EMA 20/50/200</label>
  <label><input type="checkbox" id="vol" checked>Volume</label>
  <label><input type="checkbox" id="rsi" checked>RSI 14</label>
  <span class="sep"></span>
  <button id="auto">Code trendline</button><button id="clear">Clear drawings</button>
</div>
<div id="chart"><div id="watermark"></div></div>
<div id="pineLegend"></div>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="vendor/lightweight-charts-drawing.umd.js"></script>
<script src="vela.bundle.js"></script>
<script src="theme.js"></script>
<script src="lab.js"></script>
<script>
const LC = LightweightCharts, LD = LightweightChartsDrawing;
const host = document.getElementById("chart");
const placeChart = () => { const top = document.getElementById("bar").offsetHeight; host.style.top = top + "px"; const leg = document.getElementById("pineLegend"); if (leg) leg.style.top = (top + 8) + "px"; };
placeChart(); window.addEventListener("resize", placeChart);

const chart = LC.createChart(host, {
  autoSize: true,
  layout: { background: { color: HubTheme.bg }, textColor: HubTheme.dim, fontFamily: HubTheme.font, panes: { separatorColor: HubTheme.line, separatorHoverColor: HubTheme.accent, enableResize: true } },
  grid: { vertLines: { color: HubTheme.grid }, horzLines: { color: HubTheme.grid } },
  rightPriceScale: { borderColor: HubTheme.line },
  timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 8 },
  crosshair: { mode: LC.CrosshairMode.Normal },
});

let lwPrefs = { style: "candles", ema: true, vol: true, rsi: true, scaleMode: "normal", autoScale: true };
try { Object.assign(lwPrefs, JSON.parse(localStorage.getItem("lwPrefs") || "{}")); } catch (_) {}
const saveLwPrefs = () => { try { localStorage.setItem("lwPrefs", JSON.stringify(lwPrefs)); } catch (_) {} };
let sym = LabDefaultSymbol, tf = LabDefaultTF, style = lwPrefs.style, bars = [], haBars = [], stop = null, loadingOlder = false;
if (!["candles", "hollow", "heikinashi", "bars", "line", "area", "baseline"].includes(style)) style = "candles";
document.getElementById("style").value = style;
["ema", "vol", "rsi"].forEach((id) => { document.getElementById(id).checked = lwPrefs[id] !== false; });
let price, volS, rsiS, emaS = [], drawings;

function applyScalePrefs() {
  const modeMap = { normal: LC.PriceScaleMode.Normal, log: LC.PriceScaleMode.Logarithmic, pct: LC.PriceScaleMode.Percentage };
  chart.priceScale("right").applyOptions({
    mode: modeMap[lwPrefs.scaleMode] ?? LC.PriceScaleMode.Normal,
    autoScale: lwPrefs.autoScale !== false,
  });
  document.getElementById("scaleAuto").classList.toggle("on", lwPrefs.autoScale !== false);
  document.getElementById("scaleLog").classList.toggle("on", lwPrefs.scaleMode === "log");
  document.getElementById("scalePct").classList.toggle("on", lwPrefs.scaleMode === "pct");
}
applyScalePrefs();

function makePrice() {
  if (price) chart.removeSeries(price);
  const baseVal = bars.length ? bars[0].close : 0;
  const opts = {
    candles: [LC.CandlestickSeries, { upColor: HubTheme.up, downColor: HubTheme.down, borderVisible: false, wickUpColor: HubTheme.up, wickDownColor: HubTheme.down }],
    hollow: [LC.CandlestickSeries, { upColor: "transparent", downColor: HubTheme.down, borderVisible: true, borderUpColor: HubTheme.up, borderDownColor: HubTheme.down, wickUpColor: HubTheme.up, wickDownColor: HubTheme.down }],
    heikinashi: [LC.CandlestickSeries, { upColor: HubTheme.up, downColor: HubTheme.down, borderVisible: false, wickUpColor: HubTheme.up, wickDownColor: HubTheme.down }],
    bars: [LC.BarSeries, { upColor: HubTheme.up, downColor: HubTheme.down }],
    line: [LC.LineSeries, { color: HubTheme.accent, lineWidth: 2 }],
    area: [LC.AreaSeries, { lineColor: HubTheme.accent, topColor: HubTheme.upVol, bottomColor: "rgba(0,0,0,0)" }],
    baseline: [LC.BaselineSeries, { baseValue: { type: "price", price: baseVal }, topLineColor: HubTheme.up, topFillColor1: toRgba(HubTheme.up, 0.25), topFillColor2: toRgba(HubTheme.up, 0.02), bottomLineColor: HubTheme.down, bottomFillColor1: toRgba(HubTheme.down, 0.02), bottomFillColor2: toRgba(HubTheme.down, 0.25), lineWidth: 2 }],
  }[style];
  price = chart.addSeries(opts[0], opts[1], 0);
  const saved = drawings ? drawings.exportJSON() : null;
  if (drawings) drawings.destroy();
  drawings = new LD.DrawingManager(chart, price, { magnet: "weak" });
  if (saved) drawings.importJSON(saved);
  drawings.on("tool", markTools);
  if (typeof lastPaperCfg !== "undefined" && lastPaperCfg) setPaperLines(lastPaperCfg);
}

// ---- indicators computed in the page (the library has none built in) ----
function ema(vals, n) { const k = 2 / (n + 1); let e = null; return vals.map((v) => (e = e === null ? v : v * k + e * (1 - k))); }
function rsi(vals, n = 14) {
  const out = []; let g = 0, l = 0;
  for (let i = 0; i < vals.length; i++) {
    if (i === 0) { out.push(null); continue; }
    const d = vals[i] - vals[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0);
    if (i <= n) { g += up / n; l += dn / n; out.push(i === n ? 100 - 100 / (1 + g / (l || 1e-9)) : null); }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out.push(100 - 100 / (1 + g / (l || 1e-9))); }
  }
  return out;
}
function computeHaBars(src) {
  const out = [];
  for (let i = 0; i < src.length; i++) {
    const b = src[i], close = (b.open + b.high + b.low + b.close) / 4;
    const open = i === 0 ? (b.open + b.close) / 2 : (out[i - 1].open + out[i - 1].close) / 2;
    out.push({ time: b.time, open, high: Math.max(b.high, open, close), low: Math.min(b.low, open, close), close });
  }
  return out;
}
function priceData(b) {
  if (style === "line" || style === "area" || style === "baseline") return { time: b.time, value: b.close };
  return b;
}
function updateWatermark() {
  const wm = document.getElementById("watermark");
  if (wm) { wm.textContent = `${sym} · ${tf}`; wm.style.color = HubTheme.text || "#d6dee5"; }
}
function paintAll() {
  updateWatermark();
  if (style === "baseline" && bars.length) price.applyOptions({ baseValue: { type: "price", price: bars[0].close } });
  if (style === "heikinashi") {
    haBars = computeHaBars(bars);
    price.setData(haBars);
  } else {
    price.setData(bars.map(priceData));
  }
  // Decimals as the broker quotes them (symbol digits); guess only when the broker gave none.
  const info = LabSymbols.find((x) => x.ticker === sym);
  const prec = info && info.digits != null ? info.digits : (bars.length && bars[bars.length - 1].close < 10 ? 4 : 2);
  price.applyOptions({ priceFormat: { type: "price", precision: prec, minMove: Math.pow(10, -prec) } });
  emaS.forEach((s) => chart.removeSeries(s)); emaS = [];
  if (document.getElementById("ema").checked) {
    const c = bars.map((b) => b.close);
    [[20, HubTheme.lines[0]], [50, HubTheme.lines[1]], [200, HubTheme.lines[3]]].forEach(([n, col]) => {
      const s = chart.addSeries(LC.LineSeries, { color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, 0);
      const e = ema(c, n); s.setData(bars.map((b, i) => ({ time: b.time, value: e[i] }))); emaS.push(s);
    });
  }
  if (volS) { chart.removeSeries(volS); volS = null; }
  if (rsiS) { chart.removeSeries(rsiS); rsiS = null; }
  let pane = 1;
  if (document.getElementById("vol").checked) {
    volS = chart.addSeries(LC.HistogramSeries, { priceFormat: { type: "volume" } }, pane++);
    volS.setData(bars.map((b) => ({ time: b.time, value: b.volume, color: b.close >= b.open ? HubTheme.upVol : HubTheme.downVol })));
  }
  if (document.getElementById("rsi").checked) {
    rsiS = chart.addSeries(LC.LineSeries, { color: HubTheme.accent, lineWidth: 1 }, pane++);
    const r = rsi(bars.map((b) => b.close)); rsiS.setData(bars.map((b, i) => (r[i] == null ? { time: b.time } : { time: b.time, value: r[i] })));
    rsiS.createPriceLine({ price: 70, color: HubTheme.faint, lineStyle: 2 }); rsiS.createPriceLine({ price: 30, color: HubTheme.faint, lineStyle: 2 });
  }
}

let loadGen = 0;
async function load() {
  const my = ++loadGen;               // a newer switch cancels this one
  if (stop) { stop(); stop = null; }
  const fresh = await LabFeed.history(sym, tf, null, 1000, srcOf(sym));
  if (my !== loadGen) return;         // user switched again while loading: drop stale data
  bars = fresh;
  paintAll();
  notifyPineBars();
  drawings.clear();
  let lastRepaint = 0;
  stop = LabFeed.live(sym, tf, (b) => {
    if (my !== loadGen) return;
    const last = bars[bars.length - 1];
    if (last && b.time < last.time) return;
    const isNew = !last || b.time > last.time;
    if (isNew) bars.push(b); else bars[bars.length - 1] = b;
    if (style === "heikinashi") {
      const prev = isNew ? haBars[haBars.length - 1] : haBars[haBars.length - 2];
      const close = (b.open + b.high + b.low + b.close) / 4;
      const open = prev ? (prev.open + prev.close) / 2 : (b.open + b.close) / 2;
      const ha = { time: b.time, open, high: Math.max(b.high, open, close), low: Math.min(b.low, open, close), close };
      if (isNew) haBars.push(ha); else haBars[haBars.length - 1] = ha;
      price.update(ha);
    } else {
      price.update(priceData(b));
    }
    if (volS) volS.update({ time: b.time, value: b.volume, color: b.close >= b.open ? HubTheme.upVol : HubTheme.downVol });
    if (isNew || Date.now() - lastRepaint > 2000) { lastRepaint = Date.now(); if (isNew) paintAll(); notifyPineBars(); }
  }, srcOf(sym));
}

chart.timeScale().subscribeVisibleLogicalRangeChange(async (r) => {
  if (!r || r.from > 20 || loadingOlder || !bars.length) return;
  loadingOlder = true;
  try {
    const older = await LabFeed.history(sym, tf, bars[0].time * 1000 - 1, 1000, srcOf(sym));
    const fresh = older.filter((b) => b.time < bars[0].time);
    if (fresh.length) { bars = fresh.concat(bars); paintAll(); notifyPineBars(); }
  } finally { loadingOlder = false; }
});

// ---- controls ----
const symSel = document.getElementById("sym");
// Remote MT5 groups first, then Bybit, then the Deriv backup feed, then Binance crypto. Stock lists over 500 stay out of this menu (Vela/KLineChart search them).
["arm-metal", "arm-crypto", "arm-forex", "arm-index", "arm-energy", "arm-other", "arm-stock", "bybit-metal", "bybit-perp", "bybit-spot", "bybit-futures", "bybit-inverse", "bybit-mark", "bybit-index", "nse-index", "nse-eq", "commodity", "forex", "indices", "crypto"].forEach((g) => {
  // Very long lists are cut to the 150 most traded here; Vela and KLineChart search every symbol.
  if (g === "arm-stock" && LabSymbols.filter((s) => s.group === g).length > 500) return;
  const list = LabSymbols.filter((s) => s.group === g).slice(0, g.startsWith("bybit") || g === "nse-eq" ? 150 : undefined); if (!list.length) return;
  const og = document.createElement("optgroup"); og.label = { "arm-metal": "Remote MT5 - Metals", "arm-forex": "Remote MT5 - Forex", "arm-index": "Remote MT5 - Indices", "arm-other": "Remote MT5 - Other", "arm-crypto": "Remote MT5 - Crypto", "arm-energy": "Remote MT5 - Energies", "arm-stock": "Remote MT5 - Stocks", "bybit-metal": "Bybit - Gold & Metals", "bybit-perp": "Bybit - USDT Perpetuals", "bybit-spot": "Bybit - Spot", "bybit-futures": "Bybit - Dated Futures", "bybit-inverse": "Bybit - Inverse (coin margined)", "bybit-mark": "Bybit - Mark Price", "bybit-index": "Bybit - Index Price", "nse-index": "NSE - Indices", "nse-eq": "NSE - Equities", forex: "Deriv/MT5 - Forex", commodity: "Deriv/MT5 - Commodities", crypto: "Crypto", indices: "Deriv - Indices" }[g];
  list.forEach((s) => og.appendChild(new Option(`${s.ticker}  ${s.name}`, s.ticker))); symSel.appendChild(og);
});
symSel.value = sym;
symSel.onchange = (e) => { sym = e.target.value; LabNotify(sym, tf); load(); };
const tfBox = document.getElementById("tfs");
LabTF.list.forEach((t) => { const b = document.createElement("button"); b.textContent = t; b.dataset.tf = t; b.onclick = () => { tf = t; markTF(); LabNotify(sym, tf); load(); }; tfBox.appendChild(b); });
function markTF() { tfBox.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.tf === tf)); }
document.getElementById("style").onchange = (e) => { style = e.target.value; lwPrefs.style = style; saveLwPrefs(); makePrice(); paintAll(); };
document.getElementById("scaleAuto").onclick = () => { lwPrefs.autoScale = !(lwPrefs.autoScale !== false); saveLwPrefs(); applyScalePrefs(); };
document.getElementById("scaleLog").onclick = () => { lwPrefs.scaleMode = lwPrefs.scaleMode === "log" ? "normal" : "log"; saveLwPrefs(); applyScalePrefs(); };
document.getElementById("scalePct").onclick = () => { lwPrefs.scaleMode = lwPrefs.scaleMode === "pct" ? "normal" : "pct"; saveLwPrefs(); applyScalePrefs(); };
["ema", "vol", "rsi"].forEach((id) => (document.getElementById(id).onchange = (e) => { lwPrefs[id] = e.target.checked; saveLwPrefs(); paintAll(); }));

const all = document.getElementById("alltools");
Object.keys(LD.OVERLAY_SPECS).sort().forEach((k) => all.add(new Option(k.replace(/-/g, " "), k)));
all.onchange = () => { if (all.value) drawings.setTool(all.value); };
document.querySelectorAll("[data-quick]").forEach((b) => (b.onclick = () => drawings.setTool(b.dataset.quick || null)));
function markTools() { const t = drawings.tool(); document.querySelectorAll("[data-quick]").forEach((b) => b.classList.toggle("on", (b.dataset.quick || null) === t)); if (!t) all.value = ""; }

function addCodeTrendline() {
  const n = bars.length, from = Math.max(2, n - 120), lows = [];
  for (let i = from; i < n - 2; i++) { const b = bars[i]; if (b.low < bars[i-1].low && b.low < bars[i-2].low && b.low < bars[i+1].low && b.low < bars[i+2].low) lows.push(b); }
  if (lows.length < 2) return null;
  const a = lows.reduce((m, b) => (b.low < m.low ? b : m), lows[0]);
  const later = lows.filter((b) => b.time > a.time);
  const c = later.length ? later.reduce((m, b) => (b.low < m.low ? b : m), later[0]) : lows[lows.length - 1];
  return drawings.add({ kind: "trend-line", points: [{ time: a.time, price: a.low }, { time: c.time, price: c.low }] });
}
document.getElementById("auto").onclick = addCodeTrendline;
document.getElementById("clear").onclick = () => drawings.clear();

function applyTheme() {
  const t = HubTheme;
  chart.applyOptions({ layout: { background: { color: t.bg }, textColor: t.dim, fontFamily: t.font, panes: { separatorColor: t.line, separatorHoverColor: t.accent } },
    grid: { vertLines: { color: t.grid }, horzLines: { color: t.grid } }, rightPriceScale: { borderColor: t.line }, timeScale: { borderColor: t.line } });
  makePrice(); paintAll();
}
const pineEngine = new VelaLab.PineWorkerEngine();
const pineHandles = new Map();
let pineSeq = 0;

function pineBars() {
  return bars.map((b) => ({ time: b.time * 1000, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume }));
}
function notifyPineBars() {
  for (const h of pineHandles.values()) {
    try { if (h.session && h.session.notifyBars) h.session.notifyBars("complete"); } catch (_) {}
  }
}
function clearPineSeries(h) {
  h.series.forEach((s) => { try { chart.removeSeries(s); } catch (_) {} });
  h.series = [];
}
function toRgba(col, alpha) {
  if (/^#[0-9a-f]{6}$/i.test(col)) {
    const n = parseInt(col.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
  }
  return col;
}
function pineSeriesData(points, withBreaks) {
  const byTime = new Map();
  for (const p of points) {
    if (!p || p.time == null) continue;
    const t = Math.floor(p.time / 1000);
    const valid = p.value != null && Number.isFinite(p.value);
    if (valid) {
      const d = { time: t, value: p.value };
      if (p.color) d.color = p.color;
      byTime.set(t, d);
    } else if (withBreaks && !byTime.has(t)) {
      byTime.set(t, { time: t });
    }
  }
  return Array.from(byTime.values()).sort((a, b) => a.time - b.time);
}
function _hasPerPointColor(points) {
  if (!points || points.length < 2) return false;
  let first = null;
  for (const p of points) {
    if (!p || !p.color) continue;
    if (!first) { first = p.color; continue; }
    if (p.color !== first) return true;
  }
  return false;
}
function renderPineModel(h, model) {
  h.model = model;
  clearPineSeries(h);
  const list = (model && model.series) ? model.series.filter((s) => s && Array.isArray(s.points) && s.points.length) : [];
  const overlay = !!(model && model.overlay);
  const palette = HubTheme.lines || ["#5fb3e0", "#f5a623", "#a78bfa", "#34d399", "#f87171"];
  const paneIdx = overlay ? 0 : (chart.panes ? chart.panes().length : 1);
  const stOpt = h.style || {};
  const ls = stOpt.lineStyle || "default";
  const withBreaks = ls === "line_breaks" || ls === "stepline_breaks";
  list.forEach((s, idx) => {
    const perPoint = !stOpt.color && _hasPerPointColor(s.points);
    const col = stOpt.color || s.color || palette[idx % palette.length];
    const lw = stOpt.lineWidth || s.lineWidth || 1.5;
    const pIdx = idx === 0 ? paneIdx : (overlay ? 0 : (chart.panes ? chart.panes().length - 1 : paneIdx));
    const data = pineSeriesData(s.points, withBreaks);
    let ser;
    if (ls === "histogram" || ls === "columns" || (ls === "default" && (s.type === "histogram" || s.type === "columns"))) {
      ser = chart.addSeries(LC.HistogramSeries, { color: col, priceLineVisible: false }, pIdx);
    } else if (ls === "area") {
      ser = chart.addSeries(LC.AreaSeries, { lineColor: col, lineWidth: lw, topColor: toRgba(col, 0.27), bottomColor: toRgba(col, 0), priceLineVisible: false }, pIdx);
    } else if (perPoint) {
      // Per-bar coloring (e.g. Supertrend red/green): split into color-segments so each segment
      // draws as a continuous line in its own colour. LC LineSeries per-point color only colours the
      // marker, not the line between points; drawing separate series per segment does both.
      const segments = [];
      let cur = null;
      for (const d of data) {
        const c = d.color || col;
        if (!cur || cur.color !== c) {
          // overlap: repeat the last point of the previous segment so lines join without a gap
          if (cur && cur.pts.length) {
            const overlap = { ...cur.pts[cur.pts.length - 1] };
            cur = { color: c, pts: [overlap] };
          } else {
            cur = { color: c, pts: [] };
          }
          segments.push(cur);
        }
        cur.pts.push(d);
      }
      segments.forEach((seg) => {
        if (!seg.pts.length) return;
        const opts = { color: seg.color, lineWidth: lw, priceLineVisible: false, lastValueVisible: false };
        if (ls === "stepline" || ls === "stepline_breaks" || ls === "stepline_diamond") opts.lineType = LC.LineType ? LC.LineType.WithSteps : 1;
        const segSer = chart.addSeries(LC.LineSeries, opts, pIdx);
        segSer.setData(seg.pts.map((p) => ({ time: p.time, value: p.value })));
        h.series.push(segSer);
      });
      // show last value on the final segment
      if (h.series.length) h.series[h.series.length - 1].applyOptions({ lastValueVisible: true });
      return; // skip the normal ser.setData below
    } else {
      const opts = { color: col, lineWidth: lw, priceLineVisible: false, lastValueVisible: true };
      if (ls === "stepline" || ls === "stepline_breaks" || ls === "stepline_diamond") opts.lineType = LC.LineType ? LC.LineType.WithSteps : 1;
      if (ls === "stepline_diamond") { opts.pointMarkersVisible = true; opts.pointMarkersRadius = Math.max(3, lw + 1); }
      if (ls === "circles") { opts.lineVisible = false; opts.pointMarkersVisible = true; opts.pointMarkersRadius = Math.max(3, lw + 1); }
      ser = chart.addSeries(LC.LineSeries, opts, pIdx);
    }
    ser.setData(data);
    h.series.push(ser);
  });
}

function renderPineLegend() {
  const box = document.getElementById("pineLegend");
  if (!box) return;
  box.innerHTML = "";
  for (const h of pineHandles.values()) {
    const p = document.createElement("div"); p.className = "pine-pill";
    const nm = document.createElement("span"); nm.textContent = h.title || "Pine";
    const gear = document.createElement("button"); gear.title = "Indicator settings & style"; gear.textContent = "\u2699";
    gear.onclick = () => { if (LabEmbedded) window.parent.postMessage({ evt: "indicators:open", tab: "chart", id: h.id }, location.origin); };
    const rm = document.createElement("button"); rm.title = "Remove indicator"; rm.textContent = "\u00d7";
    rm.onclick = () => { window.labChart.removePine(h.id); if (LabEmbedded) window.parent.postMessage({ evt: "ind:removed", id: h.id }, location.origin); };
    p.append(nm, gear, rm); box.appendChild(p);
  }
}

let paperPriceLines = [], lastPaperCfg = null, dragLine = null;
function setPaperLines(cfg) {
  lastPaperCfg = cfg || null;
  if (!price) return;
  paperPriceLines.forEach((x) => { try { price.removePriceLine(x.line); } catch (_) {} });
  paperPriceLines = [];
  if (!cfg || !Array.isArray(cfg.positions) || !cfg.positions.length) return;
  const add = (posId, field, val, color, title) => {
    const p = Number(val);
    if (!Number.isFinite(p) || p <= 0) return;
    const line = price.createPriceLine({
      price: p, color, lineWidth: 2,
      lineStyle: field === "entry" ? LC.LineStyle.Solid : LC.LineStyle.Dashed,
      axisLabelVisible: true, title,
    });
    paperPriceLines.push({ line, posId, field, price: p });
  };
  cfg.positions.forEach((p) => {
    if (cfg.showEntry) add(p.id, "entry", p.entryPrice, "#38bdf8", `${p.side === "long" ? "LONG" : "SHORT"}`);
    if (cfg.showSL && p.sl) add(p.id, "sl", p.sl, "#f87171", "SL");
    if (cfg.showTP && p.tp) add(p.id, "tp", p.tp, "#34d399", "TP");
  });
}
host.addEventListener("mousedown", (e) => {
  if (!price || !paperPriceLines.length) return;
  const y = e.clientY - host.getBoundingClientRect().top;
  const hit = paperPriceLines.find((x) => (x.field === "sl" || x.field === "tp") && Math.abs((price.priceToCoordinate(x.price) ?? -999) - y) <= 7);
  if (!hit) return;
  dragLine = hit;
  chart.applyOptions({ handleScroll: false, handleScale: false });
  e.preventDefault();
});
window.addEventListener("mousemove", (e) => {
  if (!dragLine || !price) return;
  const y = e.clientY - host.getBoundingClientRect().top;
  const p = price.coordinateToPrice(y);
  if (Number.isFinite(p) && p > 0) {
    dragLine.price = p;
    dragLine.line.applyOptions({ price: p });
  }
});
window.addEventListener("mouseup", () => {
  if (!dragLine) return;
  const d = dragLine; dragLine = null;
  chart.applyOptions({ handleScroll: true, handleScale: true });
  if (LabEmbedded) window.parent.postMessage({ evt: "paper:update", posId: d.posId, field: d.field, price: d.price }, location.origin);
});

window.labChart = {
  name: "lightweight",
  applyTheme,
  setMarket: (s, t) => { sym = s; tf = t || tf; if (![...symSel.options].some((o) => o.value === s)) symSel.add(new Option(s, s)); symSel.value = s; markTF(); return load(); },
  setTF: (t) => { tf = t; markTF(); return load(); },
  addCodeTrendline,
  setPaperLines,
  onChart: () => Array.from(pineHandles.values()).map((h) => ({ id: h.id, title: h.title, native: null, visible: true })),
  stylePine: (id, styleOpt) => {
    const h = pineHandles.get(id);
    if (!h) return false;
    h.style = styleOpt || {};
    if (h.model) renderPineModel(h, h.model);
    return true;
  },
  updatePine: (id, inputs) => {
    const h = pineHandles.get(id);
    if (!h || !h.session || !h.session.update) return false;
    h.session.update(inputs || {});
    return true;
  },
  removePine: (id) => {
    const h = pineHandles.get(id);
    if (!h) return false;
    try { if (h.session && h.session.stop) h.session.stop(); } catch (_) {}
    clearPineSeries(h);
    pineHandles.delete(id);
    renderPineLegend();
    return true;
  },
  addPine: async (source, inputs, props, styleOpt) => {
    const id = "pine_" + (++pineSeq);
    try {
      const prepared = await pineEngine.prepare(source);
      const title = (prepared && prepared.meta && prepared.meta.title) || "Pine";
      const inputDefs = (prepared && prepared.inputs) || [];
      const h = { id, title, session: null, series: [], style: styleOpt || {}, model: null };
      pineHandles.set(id, h);
      renderPineLegend();
      return await new Promise((done) => {
        let settled = false;
        const t = setTimeout(() => {
          if (!settled) { settled = true; done({ ok: true, id, pending: true, title, inputs: inputDefs, note: "no result within 15 s (no chart data yet?)" }); }
        }, 15000);
        h.session = pineEngine.execute({
          prepared,
          market: { symbol: sym, timeframe: LabTF.toPine(tf) },
          bars: pineBars(),
          getBars: pineBars,
          fetchSeries: (s, tfArg, range) => LabPineSeries(sym, s, tfArg, range),
          inputs: inputs || {},
          props: props || {},
          mode: "live",
          historyState: bars.length ? "complete" : "backfill",
        }, {
          onModel: (model) => {
            renderPineModel(h, model);
            if (!settled) { settled = true; clearTimeout(t); done({ ok: true, id, title, inputs: inputDefs }); }
            else if (LabEmbedded) window.parent.postMessage({ evt: "ind:ready", id }, location.origin);
          },
          onError: (err) => {
            if (!settled) {
              settled = true; clearTimeout(t); clearPineSeries(h); pineHandles.delete(id); renderPineLegend();
              done({ ok: false, id, error: String((err && err.message) || err) });
            }
          },
        });
      });
    } catch (e) {
      pineHandles.delete(id); renderPineLegend();
      return { ok: false, error: String((e && e.message) || e) };
    }
  },
  drawingCount: () => drawings.drawings().length,
  barCount: () => bars.length,
};
makePrice(); markTF(); load();
</script>
</body></html>
