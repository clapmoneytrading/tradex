<!doctype html>
<html><head><meta charset="utf-8"><title>TradeGen - KLineChart Pro engine</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="vendor/klinecharts-pro.css">
<style>
  html,body{margin:0;height:100%;background:#0f161d;color:#d6dee5;font:13px system-ui,Segoe UI,sans-serif}
  #top{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #26333f;height:31px;box-sizing:border-box}
  #top button{background:#16212b;color:#d6dee5;border:1px solid #2b3946;padding:3px 8px;cursor:pointer}
  #chart{position:absolute;top:31px;left:0;right:0;bottom:0}
  /* TradeX theme (theme.js sets the --vars) */
  .klinecharts-pro[data-theme=dark], .klinecharts-pro[data-theme=light] {
    --klinecharts-pro-primary-color: var(--accent); --klinecharts-pro-background-color: var(--bg);
    --klinecharts-pro-popover-background-color: var(--panel); --klinecharts-pro-hover-background-color: var(--raised);
    --klinecharts-pro-border-color: var(--line); --klinecharts-pro-text-color: var(--text);
    --klinecharts-pro-text-second-color: var(--dim); --klinecharts-pro-selected-color: rgba(227,163,58,.18);
  }
  #chart.klinecharts-pro { font-family: var(--font); height: auto !important }  /* its CSS fixes 80vh; top/bottom stretch it instead */
</style></head><body>
<div id="top"><b>TradeGen</b> <span style="color:#93a2af">KLineChart engine</span><button id="auto">Code trendline</button></div>
<div id="chart"></div>
<script src="vendor/klinecharts.min.js"></script>
<script src="vendor/klinecharts-pro.umd.js"></script>
<script src="vela.bundle.js"></script>
<script src="theme.js"></script>
<script src="lab.js"></script>
<script>
const SYMBOLS = LabSymbols.map((s) => ({ ticker: s.ticker, name: s.name, shortName: s.ticker, exchange: s.source === "arm" ? "Remote MT5" : s.source === "bybit" ? "BYBIT" : s.source === "mt5" ? "MT5" : s.source === "deriv" ? "DERIV" : s.source === "fyers" ? "NSE" : "BINANCE",
  pricePrecision: s.digits != null ? s.digits : (["XRPUSD", "DOGEUSD", "ADAUSD"].includes(s.ticker) ? 4 : 2), volumePrecision: 2 }));
const PERIODS = [
  { multiplier: 1, timespan: "minute", text: "1m" }, { multiplier: 5, timespan: "minute", text: "5m" },
  { multiplier: 15, timespan: "minute", text: "15m" }, { multiplier: 30, timespan: "minute", text: "30m" },
  { multiplier: 1, timespan: "hour", text: "1H" }, { multiplier: 2, timespan: "hour", text: "2H" }, { multiplier: 4, timespan: "hour", text: "4H" },
  { multiplier: 1, timespan: "day", text: "D" },
];
const tfOf = (p) => LabTF.fromAny(p.multiplier + ({ minute: "m", hour: "h", day: "d" }[p.timespan] || "m"));
const toK = (b) => ({ timestamp: b.time * 1000, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume });
let stop = null, lastBars = [], lastTicker = null;

const datafeed = {
  async searchSymbols(q) { q = (q || "").toUpperCase(); return SYMBOLS.filter((s) => s.ticker.includes(q)); },
  async getHistoryKLineData(symbol, period, from, to) {
    const bars = await LabFeed.history(symbol.ticker, tfOf(period), to);
    // No lower cut at "from": KLineChart asks for the last 500 periods, which is empty on a closed market (weekend), and it
    // pages back from the oldest candle it gets, so older candles are fine (2026-11-15, Deriv gold showed a blank chart).
    const out = bars.filter((b) => b.time * 1000 <= to).map(toK);
    if (symbol.ticker !== lastTicker || !lastBars.length || out.length && out[out.length - 1].timestamp >= lastBars[lastBars.length - 1].timestamp) { lastBars = out; lastTicker = symbol.ticker; notifyPineBars(); }
    return out;
  },
  subscribe(symbol, period, cb) {
    if (stop) stop();
    LabNotify(symbol.ticker, tfOf(period));
    stop = LabFeed.live(symbol.ticker, tfOf(period), (b) => {
      const k = toK(b);
      const last = lastBars[lastBars.length - 1];
      if (last && k.timestamp === last.timestamp) lastBars[lastBars.length - 1] = k;
      else if (!last || k.timestamp > last.timestamp) lastBars.push(k);
      notifyPineBars();
      cb(k);
    });
  },
  unsubscribe() { if (stop) { stop(); stop = null; } },
};

const pro = new klinechartspro.KLineChartPro({
  container: document.getElementById("chart"), theme: HubTheme.mode, locale: "en-US",
  symbol: SYMBOLS.find((s) => s.ticker === LabDefaultSymbol) || SYMBOLS[0], period: PERIODS[LabTF.list.indexOf(LabDefaultTF)] || PERIODS[0], periods: PERIODS, datafeed,
  subIndicators: ["VOL"], timezone: "UTC",
});

// Candle, grid and axis colours from the theme (KLineChart draws on canvas, so CSS alone does not reach them).
function applyTheme() {
  const HubT = HubTheme; pro.setTheme(HubT.mode);
  pro._chartApi.setStyles({
  grid: { horizontal: { color: HubTheme.grid }, vertical: { color: HubTheme.grid } },
  candle: { bar: { upColor: HubTheme.up, downColor: HubTheme.down, noChangeColor: HubTheme.dim,
                   upBorderColor: HubTheme.up, downBorderColor: HubTheme.down, noChangeBorderColor: HubTheme.dim,
                   upWickColor: HubTheme.up, downWickColor: HubTheme.down, noChangeWickColor: HubTheme.dim },
            priceMark: { last: { upColor: HubTheme.up, downColor: HubTheme.down, noChangeColor: HubTheme.dim } } },
  // Arrays replace the defaults, so each entry carries every field.
  indicator: { bars: [{ style: "fill", borderStyle: "solid", borderSize: 1, borderDashedValue: [2, 2], upColor: HubTheme.upVol, downColor: HubTheme.downVol, noChangeColor: HubTheme.dim }],
               lines: HubTheme.lines.map((c) => ({ style: "solid", smooth: false, size: 1, dashedValue: [2, 2], color: c })) },
  xAxis: { axisLine: { color: HubTheme.line }, tickText: { color: HubTheme.dim } },
  yAxis: { axisLine: { color: HubTheme.line }, tickText: { color: HubTheme.dim } },
  separator: { color: HubTheme.line },
  });
  // Canvas text does not inherit CSS: set the theme font on every text style.
  const fam = HubTheme.font;
  pro._chartApi.setStyles({
    candle: { tooltip: { text: { family: fam } }, priceMark: { high: { textFamily: fam }, low: { textFamily: fam }, last: { text: { family: fam } } } },
    indicator: { tooltip: { text: { family: fam } }, lastValueMark: { text: { family: fam } } },
    xAxis: { tickText: { family: fam } }, yAxis: { tickText: { family: fam } },
    crosshair: { horizontal: { text: { family: fam } }, vertical: { text: { family: fam } } },
    overlay: { text: { family: fam } },
  });
}
applyTheme();

function addCodeTrendline() {
  const api = pro._chartApi;  // internal chart, the only way to draw from code in Pro 0.1.1
  if (!api || !api.getDataList) return null;
  const d = api.getDataList(); const n = d.length; if (n < 30) return null;
  const from = Math.max(2, n - 120), lows = [];
  for (let i = from; i < n - 2; i++) if (d[i].low < d[i-1].low && d[i].low < d[i-2].low && d[i].low < d[i+1].low && d[i].low < d[i+2].low) lows.push(d[i]);
  if (lows.length < 2) return null;
  const a = lows.reduce((m, b) => (b.low < m.low ? b : m), lows[0]);
  const later = lows.filter((b) => b.timestamp > a.timestamp);
  const c = later.length ? later.reduce((m, b) => (b.low < m.low ? b : m), later[0]) : lows[lows.length - 1];
  return api.createOverlay({ name: "straightLine", points: [{ timestamp: a.timestamp, value: a.low }, { timestamp: c.timestamp, value: c.low }] });
}
document.getElementById("auto").onclick = addCodeTrendline;
const pineEngine = new VelaLab.PineWorkerEngine();
const pineHandles = new Map();
let pineSeq = 0;

function pineBars() {
  return lastBars.map((b) => ({ time: b.timestamp, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume }));
}
function notifyPineBars() {
  for (const h of pineHandles.values()) {
    try { if (h.session && h.session.notifyBars) h.session.notifyBars("complete"); } catch (_) {}
  }
}
function renderPineModel(h, model) {
  h.model = model;
  const api = pro._chartApi;
  if (!api || typeof klinecharts === "undefined") return;
  const series = (model && model.series) ? model.series.filter((s) => s && Array.isArray(s.points) && s.points.length) : [];
  const maps = series.map((s) => { const m = new Map(); for (const p of s.points) { const e = { v: p.value }; if (p.color) e.c = p.color; m.set(p.time, e); } return m; });
  const colorMaps = series.map((s) => { const m = new Map(); for (const p of s.points) if (p.color) m.set(p.time, p.color); return m; });
  const overlay = !!(model && model.overlay);
  const title = (model && (model.shorttitle || model.title)) || h.title || "Pine";
  const palette = HubTheme.lines || ["#5fb3e0", "#f5a623", "#a78bfa", "#34d399", "#f87171"];
  const stOpt = h.style || {};
  const ls = stOpt.lineStyle || "default";
  const customDraw = ["line_breaks", "stepline", "stepline_breaks", "stepline_diamond", "circles"].includes(ls);
  const figures = series.length
    ? series.map((s, idx) => ({
        key: "p" + idx,
        title: (s.title || ("P" + idx)) + ": ",
        type: (ls === "histogram" || ls === "columns" || (ls === "default" && (s.type === "histogram" || s.type === "columns"))) ? "bar" : "line",
        styles: () => ({ color: stOpt.color || s.color || palette[idx % palette.length], size: stOpt.lineWidth || s.lineWidth || 1.5 }),
      }))
    : [{ key: "p0", title: "", type: "line" }];
  const reg = {
    name: h.indName,
    shortName: title,
    series: overlay ? "price" : "normal",
    figures,
    calc: (kLineDataList) => kLineDataList.map((d) => {
      const row = {};
      maps.forEach((m, idx) => { const e = m.get(d.timestamp); if (e && e.v != null && Number.isFinite(e.v)) row["p" + idx] = e.v; });
      return row;
    }),
  };
  if (customDraw && series.length) {
    reg.draw = ({ ctx, chart, indicator, xAxis, yAxis }) => {
      const dataList = chart.getDataList();
      const range = chart.getVisibleRange();
      const result = indicator.result || [];
      const lw = stOpt.lineWidth || 1.5;
      series.forEach((s, idx) => {
        const basecol = stOpt.color || s.color || palette[idx % palette.length];
        const cMap = colorMaps[idx];
        const key = "p" + idx;
        ctx.save();
        ctx.lineWidth = lw;
        if (ls === "line_breaks") {
          let started = false, prevCol = basecol;
          ctx.beginPath(); ctx.strokeStyle = prevCol;
          for (let i = range.from; i <= range.to && i < dataList.length; i++) {
            const v = result[i] && result[i][key];
            if (v == null || !Number.isFinite(v)) { started = false; continue; }
            const x = xAxis.convertToPixel(i), y = yAxis.convertToPixel(v);
            const c = (cMap && cMap.get(dataList[i].timestamp)) || basecol;
            if (c !== prevCol) { ctx.stroke(); ctx.beginPath(); ctx.strokeStyle = c; ctx.moveTo(x, y); prevCol = c; }
            else if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        if (ls === "stepline" || ls === "stepline_breaks" || ls === "stepline_diamond") {
          let started = false, prevY = null, prevCol = basecol;
          ctx.beginPath(); ctx.strokeStyle = prevCol;
          for (let i = range.from; i <= range.to && i < dataList.length; i++) {
            const v = result[i] && result[i][key];
            if (v == null || !Number.isFinite(v)) { started = false; continue; }
            const x = xAxis.convertToPixel(i), y = yAxis.convertToPixel(v);
            const c = (cMap && cMap.get(dataList[i].timestamp)) || basecol;
            if (c !== prevCol) { ctx.stroke(); ctx.beginPath(); ctx.strokeStyle = c; if (started) { ctx.moveTo(x, prevY); ctx.lineTo(x, y); } else ctx.moveTo(x, y); prevCol = c; started = true; }
            else if (!started) { ctx.moveTo(x, y); started = true; }
            else { ctx.lineTo(x, prevY); ctx.lineTo(x, y); }
            prevY = y;
          }
          ctx.stroke();
        }
        if (ls === "stepline_diamond" || ls === "circles") {
          const r = Math.max(3, lw + 1.5);
          for (let i = range.from; i <= range.to && i < dataList.length; i++) {
            const v = result[i] && result[i][key];
            if (v == null || !Number.isFinite(v)) continue;
            const x = xAxis.convertToPixel(i), y = yAxis.convertToPixel(v);
            const c = (cMap && cMap.get(dataList[i].timestamp)) || basecol;
            ctx.fillStyle = c;
            ctx.beginPath();
            if (ls === "stepline_diamond") {
              ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath();
            } else {
              ctx.arc(x, y, r - 0.5, 0, Math.PI * 2);
            }
            ctx.fill();
          }
        }
        // Default non-custom-draw: not reachable here (this block is inside customDraw guard)
        ctx.restore();
      });
      return true;
    };
  }
  // Per-bar color for normal line style (not custom draw): add a draw override
  const hasPerBarColor = !customDraw && series.some((_, idx) => colorMaps[idx] && colorMaps[idx].size > 0);
  if (hasPerBarColor) {
    reg.draw = ({ ctx, chart, indicator, xAxis, yAxis }) => {
      const dataList = chart.getDataList();
      const range = chart.getVisibleRange();
      const result = indicator.result || [];
      const lw = stOpt.lineWidth || 1.5;
      series.forEach((s, idx) => {
        const basecol = stOpt.color || s.color || palette[idx % palette.length];
        const cMap = colorMaps[idx];
        if (!cMap || cMap.size === 0) return;
        const key = "p" + idx;
        ctx.save();
        ctx.lineWidth = lw;
        let started = false, prevCol = basecol;
        ctx.beginPath(); ctx.strokeStyle = prevCol;
        for (let i = range.from; i <= range.to && i < dataList.length; i++) {
          const v = result[i] && result[i][key];
          if (v == null || !Number.isFinite(v)) { started = false; continue; }
          const x = xAxis.convertToPixel(i), y = yAxis.convertToPixel(v);
          const c = cMap.get(dataList[i].timestamp) || basecol;
          if (c !== prevCol) { ctx.stroke(); ctx.beginPath(); ctx.strokeStyle = c; ctx.moveTo(x, y); prevCol = c; started = true; }
          else if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      });
      return true;
    };
  }
  klinecharts.registerIndicator(reg);
  if (!h.mounted || h.overlay !== overlay) {
    if (h.mounted && h.paneId) { try { api.removeIndicator(h.paneId, h.indName); } catch (_) {} }
    h.overlay = overlay;
    h.paneId = api.createIndicator(h.indName, overlay, overlay ? { id: "candle_pane" } : undefined);
    h.mounted = true;
  } else {
    api.overrideIndicator({ name: h.indName, shortName: title }, h.paneId);
  }
}

window.labChart = {
  name: "klinechart-pro",
  applyTheme,
  setMarket: (s, t) => { const x = SYMBOLS.find((y) => y.ticker === s); if (x) pro.setSymbol(x); if (t) pro.setPeriod(PERIODS[LabTF.list.indexOf(t)] || PERIODS[0]); },
  setTF: (t) => pro.setPeriod(PERIODS[LabTF.list.indexOf(t)]),
  addCodeTrendline,
  onChart: () => Array.from(pineHandles.values()).map((h) => ({ id: h.id, title: h.title, native: null, visible: true })),
  stylePine: (id, styleOpt) => {
    const h = pineHandles.get(id);
    if (!h) return false;
    h.style = styleOpt || {};
    if (h.model) renderPineModel(h, h.model);
    return true;
  },
  updatePine: (id, inputs) => {
    const h = pineHandles.get(id);
    if (!h || !h.session || !h.session.update) return false;
    h.session.update(inputs || {});
    return true;
  },
  removePine: (id) => {
    const h = pineHandles.get(id);
    if (!h) return false;
    try { if (h.session && h.session.stop) h.session.stop(); } catch (_) {}
    try { if (h.mounted && h.paneId && pro._chartApi) pro._chartApi.removeIndicator(h.paneId, h.indName); } catch (_) {}
    pineHandles.delete(id);
    return true;
  },
  addPine: async (source, inputs, props, styleOpt) => {
    const id = "pine_" + (++pineSeq);
    const indName = "TRADEX_PINE_" + pineSeq;
    try {
      const prepared = await pineEngine.prepare(source);
      const title = (prepared && prepared.meta && prepared.meta.title) || "Pine";
      const inputDefs = (prepared && prepared.inputs) || [];
      const h = { id, indName, title, session: null, paneId: null, overlay: true, mounted: false, style: styleOpt || {}, model: null };
      pineHandles.set(id, h);
      return await new Promise((done) => {
        let settled = false;
        const t = setTimeout(() => {
          if (!settled) { settled = true; done({ ok: true, id, pending: true, title, inputs: inputDefs, note: "no result within 15 s (no chart data yet?)" }); }
        }, 15000);
        const curSym = lastTicker || LabDefaultSymbol;
        const curTf = LabTF.toPine(pro.getPeriod ? tfOf(pro.getPeriod()) : LabDefaultTF);
        h.session = pineEngine.execute({
          prepared,
          market: { symbol: curSym, timeframe: curTf },
          bars: pineBars(),
          getBars: pineBars,
          fetchSeries: (s, tfArg, range) => LabPineSeries(curSym, s, tfArg, range),
          inputs: inputs || {},
          props: props || {},
          mode: "live",
          historyState: lastBars.length ? "complete" : "backfill",
        }, {
          onModel: (model) => {
            renderPineModel(h, model);
            if (!settled) { settled = true; clearTimeout(t); done({ ok: true, id, title, inputs: inputDefs }); }
            else if (LabEmbedded) window.parent.postMessage({ evt: "ind:ready", id }, location.origin);
          },
          onError: (err) => {
            if (!settled) {
              settled = true; clearTimeout(t); pineHandles.delete(id);
              done({ ok: false, id, error: String((err && err.message) || err) });
            }
          },
        });
      });
    } catch (e) {
      pineHandles.delete(id);
      return { ok: false, error: String((e && e.message) || e) };
    }
  },
  drawingCount: () => (pro._chartApi && pro._chartApi.getOverlayById ? -1 : -1),
  barCount: () => lastBars.length,
  lastBars: () => ({ ticker: lastTicker, bars: lastBars.slice(-3) }),
};
</script>
</body></html>
