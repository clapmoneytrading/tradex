<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TradeGen - NSE Fundamentals</title>
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--font); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  .brand { font-weight: 700; color: var(--accent); letter-spacing: .02em; margin-right: 4px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { background: transparent; border: 1px solid transparent; color: var(--dim); padding: 5px 10px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 12px; }
  .tabs button.on { background: var(--raised); border-color: var(--line); color: var(--text); font-weight: 600; }
  .search { display: flex; gap: 6px; margin-left: auto; align-items: center; }
  input, select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font: inherit; font-size: 12px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .btn { background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accentInk); border-color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: wait; }
  main { flex: 1; overflow: auto; padding: 14px; }
  .status { font-size: 12px; color: var(--dim); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--raised); border: 1px solid var(--line); }
  .rank-A { background: rgba(143,179,106,.18); color: var(--ok); border-color: var(--ok); }
  .rank-B { background: rgba(227,163,58,.18); color: var(--accent); border-color: var(--accent); }
  .rank-C { background: rgba(149,140,126,.18); color: var(--text); border-color: var(--dim); }
  .rank-D { background: rgba(201,85,60,.18); color: var(--bad); border-color: var(--bad); }
  .hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .hero h2 { margin: 0 0 2px; font-size: 17px; }
  .hero .sub { color: var(--dim); font-size: 12px; }
  .price-box { text-align: right; }
  .price-box .px { font-size: 20px; font-weight: 700; font-family: var(--mono); }
  .pos { color: var(--ok); }
  .neg { color: var(--bad); }
  .tier-green { color: #34d399; font-weight: 700; }
  .tier-orange { color: #f59e0b; font-weight: 700; }
  .tier-red { color: #f87171; font-weight: 700; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 4px; font-weight: 700; font-family: var(--mono); border: 1px solid transparent; }
  .pill.tier-green { background: rgba(52,211,153,.15); border-color: rgba(52,211,153,.45); }
  .pill.tier-orange { background: rgba(245,158,11,.15); border-color: rgba(245,158,11,.45); }
  .pill.tier-red { background: rgba(248,113,113,.15); border-color: rgba(248,113,113,.45); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; }
  .card span { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .card b { font-size: 15px; font-family: var(--mono); }
  .card small { display: block; font-size: 11px; margin-top: 2px; }
  h3 { margin: 0 0 8px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  th { text-align: left; padding: 7px 10px; background: var(--raised); color: var(--dim); border-bottom: 1px solid var(--line); font-weight: 600; cursor: pointer; white-space: nowrap; }
  td { padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  tr:hover td { background: rgba(255,255,255,.03); }
  .clickable { cursor: pointer; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .empty { padding: 30px; text-align: center; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  @media print {
    header, .toolbar, .no-print { display: none !important; }
    body, main { overflow: visible; height: auto; background: #fff; color: #000; }
    table, .hero, .card { border-color: #ccc; background: #fff; color: #000; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">TradeGen Fundamentals</span>
  <div class="tabs">
    <button type="button" id="tabDetail" class="on">Stock Details</button>
    <button type="button" id="tabReport">Saved Stocks &amp; Report (<span id="savedCount">0</span>)</button>
  </div>
  <form class="search" id="searchForm">
    <input id="symInput" placeholder="NSE Symbol (e.g. ICICIBANK)" autocomplete="off" spellcheck="false">
    <button type="submit" class="btn primary" id="btnFetch">Fetch &amp; Save</button>
  </form>
</header>
<main id="main"></main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let view = "detail";
let currentRec = null;
let currentMsg = "";
let allRecords = [];
let sortKey = "updated_at";
let sortDir = -1;
let filterText = "";
let filterRank = "";
let filterMinEps = "";
let filterMinRs = "";

function normalizeSym(s) {
  return String(s || "").trim().toUpperCase().replace(/^NSE:/, "").replace(/-(EQ|BE|BZ|SM|ST|INDEX)$/, "");
}
function isNseTicker(s) {
  const u = String(s || "").trim().toUpperCase();
  return /^NSE:/.test(u) || /-(EQ|BE|SM|INDEX)$/.test(u);
}
function fmtDate(iso) {
  if (!iso) return "-";
  try { return new Date(iso).toLocaleString(); } catch (_) { return iso; }
}
function chgClass(v) {
  const n = parseFloat(String(v || "").replace(/[^0-9.\-]/g, ""));
  if (!Number.isFinite(n) || n === 0) return "";
  return n > 0 ? "pos" : "neg";
}
function scoreTier(v, greenMin = 80, orangeMin = 60) {
  const n = parseFloat(String(v || "").replace(/[^0-9.\-]/g, ""));
  if (!Number.isFinite(n)) return "";
  return n >= greenMin ? "tier-green" : n >= orangeMin ? "tier-orange" : "tier-red";
}
function demandTier(v) {
  const s = String(v || "").trim().toUpperCase();
  if (!s) return "";
  if (["A+", "A", "A-", "B+", "B"].includes(s)) return "tier-green";
  if (["B-", "C+", "C"].includes(s)) return "tier-orange";
  return "tier-red";
}

async function loadStock(sym) {
  const clean = normalizeSym(sym);
  if (!clean) return;
  $("symInput").value = clean;
  view = "detail";
  updateTabs();
  $("btnFetch").disabled = true;
  currentMsg = `Fetching & saving ${clean}...`;
  render();
  try {
    const r = await fetch(`/api/fundamentals?symbol=${encodeURIComponent(clean)}`);
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || "Lookup failed");
    currentRec = j.record;
    if (j.stale) currentMsg = `Offline/API error (${j.error}) — showing saved record`;
    else currentMsg = j.existed ? `Updated in local file (${j.total} stocks stored)` : `Saved to local file (${j.total} stocks stored)`;
    await refreshList(false);
  } catch (e) {
    currentMsg = `Error: ${e.message || e}`;
  } finally {
    $("btnFetch").disabled = false;
    render();
  }
}

async function refreshList(doRender = true) {
  try {
    const r = await fetch("/api/fundamentals/list");
    const j = await r.json();
    allRecords = Array.isArray(j.records) ? j.records : [];
    $("savedCount").textContent = String(allRecords.length);
  } catch (_) {}
  if (doRender) render();
}

function updateTabs() {
  $("tabDetail").classList.toggle("on", view === "detail");
  $("tabReport").classList.toggle("on", view === "report");
}

function render() {
  const m = $("main");
  if (view === "detail") {
    if (!currentRec) {
      m.innerHTML = `<div class="status"><span>${esc(currentMsg || "Enter an NSE stock symbol above to fetch and save fundamental details.")}</span></div>`;
      return;
    }
    const r = currentRec;
    const rankCls = r.master_rank ? `rank-${r.master_rank}` : "";
    const qs = Array.isArray(r.quarterly_earnings_last_4) ? r.quarterly_earnings_last_4 : [];
    m.innerHTML = `
      <div class="status">
        <span>${esc(currentMsg)}</span>
        <span>Updated: ${esc(fmtDate(r.updated_at))}</span>
      </div>
      <div class="hero">
        <div>
          <h2>${esc(r.stock_name || r.symbol)} <span class="badge">${esc(r.symbol)}</span> ${r.master_rank ? `<span class="badge ${rankCls}">Rank ${esc(r.master_rank)} (${esc(r.master_score || "-")})</span>` : ""}</h2>
          <div class="sub">Sector: <b>${esc(r.sector || "-")}</b>${r.industry_group_rank ? ` (Group Rank ${esc(r.industry_group_rank)})` : ""} · Saved in hub/.cache/fundamentals.json</div>
        </div>
        <div class="price-box">
          <div class="px">₹${esc(r.current_price || "-")}</div>
          <div class="${chgClass(r.change)}">${esc(r.change || "-")}</div>
        </div>
      </div>
      <div class="grid">
        <div class="card"><span>EPS Strength</span><b class="${scoreTier(r.eps_rating, 80, 60)}">${esc(r.eps_rating || "-")}</b><small>80+ Green · 60-79 Orange · &lt;60 Red</small></div>
        <div class="card"><span>Price Strength (RS)</span><b class="${scoreTier(r.rs_rating, 80, 60)}">${esc(r.rs_rating || "-")}</b><small>80+ Green · 60-79 Orange · &lt;60 Red</small></div>
        <div class="card"><span>Buyer Demand</span><b class="pill ${demandTier(r.buyer_demand)}">${esc(r.buyer_demand || "-")}</b><small>A+..B Green · B-..C Orange · C-..E Red</small></div>
        <div class="card"><span>Master Score</span><b class="${scoreTier(r.master_score, 80, 60)}">${esc(r.master_score || "-")}</b><small>Rank ${esc(r.master_rank || "-")}</small></div>
        <div class="card"><span>P/E Ratio</span><b>${esc(r.pe_ratio || "-")}</b></div>
        <div class="card"><span>Return on Equity</span><b class="${scoreTier(r.return_on_equity, 17, 10)}">${esc(r.return_on_equity || "-")}</b><small>17%+ Green · 10-16% Orange</small></div>
        <div class="card"><span>Last 4Q Avg EPS %</span><b class="${chgClass(r.last_4_quarterly_earnings_percent)}">${esc(r.last_4_quarterly_earnings_percent || "-")}</b></div>
        <div class="card"><span>Latest Qtr EPS %</span><b class="${chgClass(r.eps_percent)}">${esc(r.eps_percent || "-")}</b></div>
        <div class="card"><span>Latest Qtr Sales (Cr)</span><b>${esc(r.sales_cr || "-")}</b><small class="${chgClass(r.sales_change_percent)}">${esc(r.sales_change_percent || "-")}</small></div>
        <div class="card"><span>No. of Funds</span><b>${esc(r.no_of_funds || "-")}</b><small class="${chgClass(r.no_of_funds_percent)}">${esc(r.no_of_funds_percent || "-")}</small></div>
        <div class="card"><span>Shares Held by Funds</span><b>${esc(r.shares_held_by_funds || "-")}</b><small class="${chgClass(r.shares_held_by_funds_percent)}">${esc(r.shares_held_by_funds_percent || "-")}</small></div>
      </div>
      <h3>Last 4 Quarters Performance</h3>
      ${qs.length ? `<table><thead><tr><th>Quarter</th><th>EPS</th><th>EPS % Chg</th><th>Sales (Cr)</th><th>Sales % Chg</th></tr></thead><tbody>${
        qs.map((q) => `<tr>
          <td><b>${esc(q.date || "-")}</b></td>
          <td>${esc(q.eps || "-")}</td>
          <td class="${chgClass(q.eps_change_percent)}">${esc(q.eps_change_percent || "-")}</td>
          <td>${esc(q.sales_cr || "-")}</td>
          <td class="${chgClass(q.sales_change_percent)}">${esc(q.sales_change_percent || "-")}</td>
        </tr>`).join("")
      }</tbody></table>` : `<div class="empty">No quarterly data returned for this symbol.</div>`}
    `;
    return;
  }

  // Saved Stocks & Report view
  const minEps = parseFloat(filterMinEps);
  const minRs = parseFloat(filterMinRs);
  const q = filterText.trim().toLowerCase();
  const filtered = allRecords.filter((r) => {
    if (q && !(String(r.symbol || "").toLowerCase().includes(q) || String(r.stock_name || "").toLowerCase().includes(q))) return false;
    if (filterRank && r.master_rank !== filterRank) return false;
    if (Number.isFinite(minEps) && (parseFloat(r.eps_rating) || 0) < minEps) return false;
    if (Number.isFinite(minRs) && (parseFloat(r.rs_rating) || 0) < minRs) return false;
    return true;
  }).sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    const na = parseFloat(String(va ?? "").replace(/[^0-9.\-]/g, ""));
    const nb = parseFloat(String(vb ?? "").replace(/[^0-9.\-]/g, ""));
    if (Number.isFinite(na) && Number.isFinite(nb) && sortKey !== "updated_at") return (na - nb) * sortDir;
    return String(va || "").localeCompare(String(vb || "")) * sortDir;
  });

  m.innerHTML = `
    <div class="toolbar">
      <input id="fText" placeholder="Filter symbol / name" value="${esc(filterText)}">
      <select id="fRank">
        <option value="">All Ranks</option>
        <option value="A" ${filterRank === "A" ? "selected" : ""}>Rank A</option>
        <option value="B" ${filterRank === "B" ? "selected" : ""}>Rank B</option>
        <option value="C" ${filterRank === "C" ? "selected" : ""}>Rank C</option>
        <option value="D" ${filterRank === "D" ? "selected" : ""}>Rank D</option>
      </select>
      <input id="fEps" type="number" placeholder="Min EPS" style="width:85px" value="${esc(filterMinEps)}">
      <input id="fRs" type="number" placeholder="Min RS" style="width:85px" value="${esc(filterMinRs)}">
      <button type="button" class="btn primary" id="btnCsv">Download CSV Report</button>
      <button type="button" class="btn" id="btnPrint">Print / PDF Report</button>
      <button type="button" class="btn" id="btnRefreshAll">Refresh All (${allRecords.length})</button>
    </div>
    <div class="status"><span>Showing ${filtered.length} of ${allRecords.length} stored NSE stocks</span><span id="refStatus"></span></div>
    ${filtered.length ? `<table><thead><tr>
      <th data-s="symbol">Symbol</th><th data-s="stock_name">Company</th><th data-s="sector">Sector</th><th data-s="current_price">Price</th>
      <th data-s="master_rank">Rank</th><th data-s="master_score">Score</th><th data-s="eps_rating">EPS</th>
      <th data-s="rs_rating">RS</th><th data-s="buyer_demand">Buyer Demand</th><th data-s="pe_ratio">P/E</th><th data-s="return_on_equity">ROE</th>
      <th data-s="sales_change_percent">Sales %</th><th data-s="no_of_funds">Funds</th><th class="no-print"></th>
    </tr></thead><tbody>${
      filtered.map((r) => `<tr class="clickable" data-open="${esc(r.symbol)}">
        <td><b>${esc(r.symbol)}</b></td>
        <td>${esc(r.stock_name || "-")}</td>
        <td>${esc(r.sector || "-")}</td>
        <td>₹${esc(r.current_price || "-")} <small class="${chgClass(r.change)}">${esc(r.change || "")}</small></td>
        <td>${r.master_rank ? `<span class="badge rank-${esc(r.master_rank)}">${esc(r.master_rank)}</span>` : "-"}</td>
        <td class="${scoreTier(r.master_score, 80, 60)}">${esc(r.master_score || "-")}</td>
        <td class="${scoreTier(r.eps_rating, 80, 60)}">${esc(r.eps_rating || "-")}</td>
        <td class="${scoreTier(r.rs_rating, 80, 60)}">${esc(r.rs_rating || "-")}</td>
        <td><span class="pill ${demandTier(r.buyer_demand)}">${esc(r.buyer_demand || "-")}</span></td>
        <td>${esc(r.pe_ratio || "-")}</td>
        <td class="${scoreTier(r.return_on_equity, 17, 10)}">${esc(r.return_on_equity || "-")}</td>
        <td class="${chgClass(r.sales_change_percent)}">${esc(r.sales_change_percent || "-")}</td>
        <td>${esc(r.no_of_funds || "-")}</td>
        <td class="no-print"><button type="button" class="btn" data-del="${esc(r.symbol)}" title="Remove">×</button></td>
      </tr>`).join("")
    }</tbody></table>` : `<div class="empty">No stored NSE stocks match your filter.</div>`}
  `;

  $("fText").oninput = (e) => { filterText = e.target.value; render(); $("fText").focus(); };
  $("fRank").onchange = (e) => { filterRank = e.target.value; render(); };
  $("fEps").oninput = (e) => { filterMinEps = e.target.value; render(); $("fEps").focus(); };
  $("fRs").oninput = (e) => { filterMinRs = e.target.value; render(); $("fRs").focus(); };
  $("btnCsv").onclick = () => { location.href = "/api/fundamentals/export"; };
  $("btnPrint").onclick = () => { window.print(); };
  $("btnRefreshAll").onclick = async () => {
    $("btnRefreshAll").disabled = true;
    $("refStatus").textContent = "Updating all stored stocks...";
    try {
      const r = await fetch("/api/fundamentals/refresh", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      const j = await r.json();
      await refreshList(false);
      $("refStatus").textContent = `Updated ${j.updated}/${j.total} stocks`;
      render();
    } catch (e) {
      $("refStatus").textContent = "Refresh failed: " + (e.message || e);
    }
  };
  m.querySelectorAll("th[data-s]").forEach((th) => {
    th.onclick = () => {
      const k = th.dataset.s;
      if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
      render();
    };
  });
  m.querySelectorAll("tr[data-open]").forEach((tr) => {
    tr.onclick = (e) => {
      if (e.target.closest("[data-del]")) return;
      const sym = tr.dataset.open;
      currentRec = allRecords.find((x) => x.symbol === sym) || null;
      currentMsg = "Loaded from saved file (click Fetch & Save to refresh live)";
      $("symInput").value = sym;
      view = "detail";
      updateTabs();
      render();
    };
  });
  m.querySelectorAll("[data-del]").forEach((b) => {
    b.onclick = async (e) => {
      e.stopPropagation();
      await fetch("/api/fundamentals/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol: b.dataset.del }),
      });
      await refreshList(true);
    };
  });
}

$("tabDetail").onclick = () => { view = "detail"; updateTabs(); render(); };
$("tabReport").onclick = () => { view = "report"; updateTabs(); refreshList(true); };
$("searchForm").onsubmit = (e) => { e.preventDefault(); loadStock($("symInput").value); };

try {
  const bc = new BroadcastChannel("tradegen_fundamentals");
  bc.onmessage = (e) => {
    if (e.data && e.data.symbol && isNseTicker(e.data.symbol)) {
      loadStock(e.data.symbol);
    }
  };
} catch (_) {}

const initSym = new URLSearchParams(location.search).get("symbol") || "";
refreshList(false).then(() => {
  if (initSym && isNseTicker(initSym)) loadStock(initSym);
  else if (initSym) {
    currentMsg = `Current chart (${initSym}) is not an NSE stock. Enter an NSE symbol above or open Saved Stocks & Report.`;
    render();
  } else {
    render();
  }
});
</script>
</body>
</html>
